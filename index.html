<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

// =============== ANONİM İSTATİSTİK ===============
// Resmi test tamamlanınca (5 denemenin medyanı) buraya POST edilir.
// Boş bırakılırsa hiçbir gönderim yapılmaz. Kendi endpoint adresini yaz.
// ÖNEMLİ (KVKK): Sunucu tarafında IP adresi loglamayı KAPAT veya anında sil;
// istek gövdesi dışında hiçbir başlık/tanımlayıcı kaydetme. Gönderilen paket
// kimliksizdir: { test, medianMs, attempts, wrong, ageRange, team, day }.
const STATS_URL = "";

const AGE_RANGES = [
  { id:"u18",   label:"18 yaş altı" },
  { id:"18-24", label:"18–24" },
  { id:"25-34", label:"25–34" },
  { id:"35-44", label:"35–44" },
  { id:"45-54", label:"45–54" },
  { id:"55+",   label:"55+" },
];

const TEAMS = [
  { id:"volt",    name:"VOLT",    emoji:"⚡", color:"#FFE14D", desc:"Ham hız" },
  { id:"sinyal",  name:"SİNYAL",  emoji:"🧠", color:"#8EA3FF", desc:"Keskin karar" },
  { id:"itki",    name:"İTKİ",    emoji:"🚀", color:"#4DFFB0", desc:"Patlayıcı hamle" },
  { id:"sogutma", name:"SOĞUTMA", emoji:"❄️", color:"#5AD7FF", desc:"Buz gibi sakin" },
];
const teamOf = (id) => TEAMS.find(t => t.id === id) || null;

// Profil sadece bu cihazda saklanır (localStorage). Bazı önizleme ortamlarında
// localStorage kapalı olabilir; o durumda sessizce oturum içi çalışır.
const PROFILE_KEY = "reacto.profile.v1";
const loadProfile = () => {
  try { const raw = localStorage.getItem(PROFILE_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
};
const saveProfile = (p) => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch {} };
const clearProfile = () => { try { localStorage.removeItem(PROFILE_KEY); } catch {} };

// Gönderim: yalnızca onay verilmiş + 18 yaş üstü + STATS_URL tanımlı ise.
// Kimlik yok, çerez yok, saat yok (yalnızca gün). Hata sessizce yutulur.
const sendStats = (profile, payload) => {
  if (!STATS_URL) return;
  if (!profile || profile.consent !== "accepted" || profile.ageRange === "u18") return;
  const body = JSON.stringify({
    ...payload,
    ageRange: profile.ageRange,
    team: profile.team,
    day: new Date().toISOString().slice(0, 10),
  });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_URL, new Blob([body], { type: "application/json" }));
    } else {
      fetch(STATS_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body, keepalive:true }).catch(()=>{});
    }
  } catch {}
};

// =============== SEVİYELER ===============
const TIERS_TAP = [
  { max: 200,      name: "TURBO MODE",   emoji: "⚡", color: "#FFE14D", msg: "Makine hızı. İnsan mısın sen?" },
  { max: 250,      name: "OVERCLOCKED",  emoji: "🔥", color: "#FF7A45", msg: "Limitler zorlanıyor. Elit seviye." },
  { max: 300,      name: "BOOSTED",      emoji: "🚀", color: "#4DFFB0", msg: "Hızlandırılmış modda çalışıyorsun." },
  { max: 400,      name: "ONLINE",       emoji: "✅", color: "#4DA6FF", msg: "Sistem çalışıyor. Sağlam ortalama." },
  { max: 500,      name: "STANDBY",      emoji: "🔋", color: "#9B8CFF", msg: "Bekleme modundasın. Uyanabilirsin." },
  { max: 650,      name: "LOW BATTERY",  emoji: "🐌", color: "#C9A15A", msg: "Şarj lazım. Bir kahve iyi gider." },
  { max: 1000,     name: "SLEEP MODE",   emoji: "💤", color: "#7C86A0", msg: "Uykuda yakalandın." },
  { max: Infinity, name: "OFFLINE",      emoji: "🔌", color: "#5A6172", msg: "Fişin çekilmiş. Yeniden bağlan." },
];
// Seçimli tepki (yön) basit tepkiden ~150 ms yavaştır; sınırlar kaydırıldı
const TIERS_TILT = [
  { max: 300,      name: "TURBO MODE",   emoji: "⚡", color: "#FFE14D", msg: "Karar + hareket, göz açıp kapayana kadar." },
  { max: 375,      name: "OVERCLOCKED",  emoji: "🔥", color: "#FF7A45", msg: "Bilek ve beyin senkronize. Elit." },
  { max: 450,      name: "BOOSTED",      emoji: "🚀", color: "#4DFFB0", msg: "Hızlı karar, temiz hareket." },
  { max: 575,      name: "ONLINE",       emoji: "✅", color: "#4DA6FF", msg: "Sistem çalışıyor. Sağlam ortalama." },
  { max: 700,      name: "STANDBY",      emoji: "🔋", color: "#9B8CFF", msg: "Biraz düşündün, sonra hareket ettin." },
  { max: 900,      name: "LOW BATTERY",  emoji: "🐌", color: "#C9A15A", msg: "Bilek uyanık ama beyin kahve bekliyor." },
  { max: 1300,     name: "SLEEP MODE",   emoji: "💤", color: "#7C86A0", msg: "Ok epey bekledi seni." },
  { max: Infinity, name: "OFFLINE",      emoji: "🔌", color: "#5A6172", msg: "Bağlantı koptu. Yeniden dene." },
];
const tiersOf = (test) => test === "tap" ? TIERS_TAP : TIERS_TILT;
const tierFor = (test, ms) => tiersOf(test).find(t => ms < t.max);
const median = (arr) => { const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); };

const PCT = {
  tap:  [[180,99.7],[200,99],[230,96],[250,92],[280,83],[300,74],[330,62],[360,52],[400,39],[450,26],[500,17],[600,7],[750,2],[1000,0.5]],
  tilt: [[280,99.5],[320,97],[375,90],[420,78],[470,64],[520,52],[575,40],[650,26],[750,14],[900,6],[1100,2],[1300,0.8]],
};
function percentileFaster(test, ms) {
  const pts = PCT[test];
  if (ms <= pts[0][0]) return pts[0][1];
  for (let i=1;i<pts.length;i++){ if(ms<=pts[i][0]){ const[a,b]=pts[i-1],[c,d]=pts[i]; return b+(d-b)*(ms-a)/(c-a);} }
  return 0.3;
}

const DIRS = {
  left:  { arrow:"◀", label:"SOLA",   axis:"gamma", sign:-1 },
  right: { arrow:"▶", label:"SAĞA",   axis:"gamma", sign: 1 },
  up:    { arrow:"▲", label:"İLERİ",  axis:"beta",  sign:-1 },
  down:  { arrow:"▼", label:"GERİYE", axis:"beta",  sign: 1 },
};
const DIR_KEYS = Object.keys(DIRS);
const TILT_THRESHOLD = 16;
const OFFICIAL_N = 5;
const TEST_NAMES = { tap: "Dokunma Refleksi", tilt: "Yön Refleksi" };
const TEST_ICONS = { tap: "👆", tilt: "🧭" };

// =============== ROBOT ===============
function RobotFace({ mood, color }) {
  const eyes = {
    idle:   <><rect x="28" y="38" width="14" height="14" rx="4" fill={color}/><rect x="58" y="38" width="14" height="14" rx="4" fill={color}/></>,
    armed:  <><rect x="28" y="42" width="14" height="6" rx="3" fill={color}/><rect x="58" y="42" width="14" height="6" rx="3" fill={color}/></>,
    go:     <><circle cx="35" cy="45" r="9" fill={color}/><circle cx="65" cy="45" r="9" fill={color}/></>,
    happy:  <><path d="M28 48 q7-12 14 0" stroke={color} strokeWidth="5" fill="none" strokeLinecap="round"/><path d="M58 48 q7-12 14 0" stroke={color} strokeWidth="5" fill="none" strokeLinecap="round"/></>,
    dizzy:  <><text x="27" y="52" fontSize="18" fill={color}>×</text><text x="57" y="52" fontSize="18" fill={color}>×</text></>,
    sleepy: <><rect x="28" y="46" width="14" height="4" rx="2" fill={color}/><rect x="58" y="46" width="14" height="4" rx="2" fill={color}/></>,
    error:  <><rect x="28" y="40" width="14" height="10" rx="2" fill={color} transform="rotate(12 35 45)"/><rect x="58" y="40" width="14" height="10" rx="2" fill={color} transform="rotate(-12 65 45)"/></>,
  };
  const mouth = {
    idle:   <rect x="40" y="62" width="20" height="5" rx="2.5" fill={color} opacity="0.7"/>,
    armed:  <rect x="42" y="63" width="16" height="4" rx="2" fill={color} opacity="0.7"/>,
    go:     <circle cx="50" cy="66" r="6" fill={color} opacity="0.8"/>,
    happy:  <path d="M38 62 q12 12 24 0" stroke={color} strokeWidth="5" fill="none" strokeLinecap="round"/>,
    dizzy:  <path d="M38 68 q6-6 12 0 q6 6 12 0" stroke={color} strokeWidth="4" fill="none" strokeLinecap="round"/>,
    sleepy: <ellipse cx="50" cy="66" rx="5" ry="7" fill={color} opacity="0.6"/>,
    error:  <path d="M38 68 q12-10 24 0" stroke={color} strokeWidth="5" fill="none" strokeLinecap="round"/>,
  };
  return (
    <svg viewBox="0 0 100 100" style={{ width:"100%", height:"100%" }}>
      <rect x="12" y="20" width="76" height="62" rx="16" fill="none" stroke={color} strokeWidth="4"/>
      <line x1="50" y1="8" x2="50" y2="20" stroke={color} strokeWidth="4" strokeLinecap="round"/>
      <circle cx="50" cy="7" r="4" fill={color}/>
      <rect x="2" y="42" width="8" height="18" rx="4" fill={color} opacity="0.6"/>
      <rect x="90" y="42" width="8" height="18" rx="4" fill={color} opacity="0.6"/>
      {eyes[mood]}{mouth[mouth[mood] ? mood : "idle"]}
    </svg>
  );
}

const blankTestState = () => ({ history: [], best: null, official: [], wrong: 0, cert: null });

function Reacto() {
  const savedProfile = loadProfile();
  const profileComplete = (p) => p && p.consent && p.ageRange && p.team;
  const [profile, setProfile] = useState(savedProfile);
  const [screen, setScreen] = useState(profileComplete(savedProfile) ? "gate" : "onboard");
  const [obStep, setObStep] = useState("consent"); // consent | profile
  const [selAge, setSelAge] = useState(savedProfile?.ageRange || null);
  const [selTeam, setSelTeam] = useState(savedProfile?.team || null);
  const [checked, setChecked] = useState(false);
  const [sensorState, setSensorState] = useState("idle"); // idle|requesting|granted|denied|nodata
  const [simMode, setSimMode] = useState(false);
  const [tiltNow, setTiltNow] = useState({ beta:0, gamma:0 });

  const [test, setTest] = useState("tap");   // tap | tilt
  const [mode, setMode] = useState("free");  // free | official
  const [phase, setPhase] = useState("idle");// idle|armed|go|result|early|wrong|certificate
  const [target, setTarget] = useState(null);
  const [result, setResult] = useState(null);
  const [stats, setStats] = useState({ tap: blankTestState(), tilt: blankTestState() });
  const [shareMsg, setShareMsg] = useState("");

  const timerRef = useRef(null);
  const goTimeRef = useRef(0);
  const baselineRef = useRef({ beta:0, gamma:0 });
  const latestRef = useRef({ beta:0, gamma:0 });
  const dragStartRef = useRef(null);
  const ref = useRef({});
  ref.current = { phase, target, test, mode, stats, simMode, profile };

  useEffect(() => () => clearTimeout(timerRef.current), []);

  const S = stats[test];
  const patch = (t, updates) => setStats(s => ({ ...s, [t]: { ...s[t], ...updates } }));

  // ---- Sensör ----
  const onOrientation = useCallback((e) => {
    if (e.beta === null || e.gamma === null) return;
    onOrientation.seen = true;
    latestRef.current = { beta: e.beta, gamma: e.gamma };
    setTiltNow({ beta: e.beta, gamma: e.gamma });
    const { phase, target, test } = ref.current;
    if (test !== "tilt" || phase !== "go" || !target) return;
    const base = baselineRef.current, now = latestRef.current;
    const d = { beta: now.beta - base.beta, gamma: now.gamma - base.gamma };
    for (const key of DIR_KEYS) {
      const dir = DIRS[key];
      if (d[dir.axis] * dir.sign > TILT_THRESHOLD) { registerTilt(key); return; }
    }
  }, []);

  const enableSensor = async () => {
    setSensorState("requesting");
    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== "granted") { setSensorState("denied"); return; }
      }
      onOrientation.seen = false;
      window.addEventListener("deviceorientation", onOrientation);
      setTimeout(() => setSensorState(onOrientation.seen ? "granted" : "nodata"), 1200);
    } catch { setSensorState("denied"); }
  };

  // ---- Ortak akış ----
  const arm = useCallback(() => {
    setPhase("armed"); setResult(null); setTarget(null); setShareMsg("");
    const delay = 1300 + Math.random() * 2400;
    timerRef.current = setTimeout(() => {
      if (ref.current.test === "tilt") {
        baselineRef.current = { ...latestRef.current };
        setTarget(DIR_KEYS[Math.floor(Math.random() * DIR_KEYS.length)]);
      }
      goTimeRef.current = performance.now();
      setPhase("go");
    }, delay);
  }, []);

  const recordSuccess = (ms) => {
    const { test, mode, stats } = ref.current;
    const st = stats[test];
    const newHist = [...st.history.slice(-9), ms];
    const newBest = st.best === null || ms < st.best ? ms : st.best;
    if (mode === "official") {
      const next = [...st.official, ms];
      if (next.length >= OFFICIAL_N) {
        const med = median(next);
        patch(test, { history: newHist, best: newBest, official: next,
          cert: { median: med, tier: tierFor(test, med), pct: percentileFaster(test, med), attempts: next } });
        setResult(ms); setPhase("certificate");
        sendStats(ref.current.profile, { test, medianMs: med, attempts: next, wrong: st.wrong });
        return;
      }
      patch(test, { history: newHist, best: newBest, official: next });
    } else {
      patch(test, { history: newHist, best: newBest });
    }
    setResult(ms); setPhase("result");
  };

  const registerTilt = (movedKey) => {
    const ms = Math.round(performance.now() - goTimeRef.current);
    if (movedKey === ref.current.target) recordSuccess(ms);
    else { patch(ref.current.test, { wrong: ref.current.stats[ref.current.test].wrong + 1 }); setPhase("wrong"); }
  };

  const handlePad = () => {
    const p = ref.current.phase;
    if (p === "certificate") return;
    if (p === "idle" || p === "result" || p === "early" || p === "wrong") { arm(); return; }
    if (ref.current.test === "tap") {
      if (p === "armed") { clearTimeout(timerRef.current); setPhase("early"); return; }
      if (p === "go") recordSuccess(Math.round(performance.now() - goTimeRef.current));
    }
    // tilt testinde go/armed sırasında dokunmak bir şey yapmaz — hareket bekleriz
  };

  // Sim modu (tilt): sürükleme = eğme
  const onSimStart = (e) => { dragStartRef.current = { x: e.clientX, y: e.clientY }; };
  const onSimMove = (e) => {
    if (!ref.current.simMode || ref.current.test !== "tilt") return;
    if (!dragStartRef.current || ref.current.phase !== "go") return;
    const dx = e.clientX - dragStartRef.current.x, dy = e.clientY - dragStartRef.current.y;
    if (Math.abs(dx) < 60 && Math.abs(dy) < 60) return;
    const key = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    dragStartRef.current = null;
    registerTilt(key);
  };
  const onSimEnd = () => { dragStartRef.current = null; };

  const switchTest = (t) => {
    clearTimeout(timerRef.current);
    setTest(t); setPhase("idle"); setResult(null); setTarget(null); setShareMsg("");
    if (mode === "official") patch(t, { official: [], cert: null });
  };
  const startOfficial = () => { patch(test, { official: [], cert: null, wrong: 0 }); setMode("official"); setPhase("idle"); setResult(null); setShareMsg(""); };
  const exitOfficial  = () => { setMode("free"); setPhase("idle"); setResult(null); setShareMsg(""); };

  const shareCert = async () => {
    const cert = S.cert; if (!cert) return;
    const myTeam = teamOf(profile?.team);
    const text = `${TEST_ICONS[test]} REACTO — ${TEST_NAMES[test]} Resmi Sonucum${myTeam ? `\n${myTeam.emoji} Takım ${myTeam.name}` : ""}\n${cert.tier.emoji} ${cert.tier.name} — medyan ${cert.median} ms\nİnsanların %${cert.pct < 1 ? cert.pct.toFixed(1) : Math.round(cert.pct)}'inden hızlıyım!\nDenemeler: ${cert.attempts.join(", ")} ms${test==="tilt" && S.wrong ? `\nYanlış yön: ${S.wrong}` : ""}`;
    try {
      if (navigator.share) { await navigator.share({ text }); setShareMsg("Paylaşıldı"); }
      else { await navigator.clipboard.writeText(text); setShareMsg("Panoya kopyalandı ✓"); }
    } catch {
      try { await navigator.clipboard.writeText(text); setShareMsg("Panoya kopyalandı ✓"); }
      catch { setShareMsg("Paylaşım desteklenmiyor"); }
    }
  };

  const TIERS = tiersOf(test);
  const tier = result !== null ? tierFor(test, result) : null;
  const avg = S.history.length ? Math.round(S.history.reduce((a,b)=>a+b,0)/S.history.length) : null;
  const pct = result !== null ? percentileFaster(test, result) : null;
  const cert = S.cert;

  const mood =
    phase === "armed" ? "armed" :
    phase === "go" ? "go" :
    phase === "early" || phase === "wrong" ? "error" :
    phase === "certificate" && cert ? (cert.tier.max <= (test==="tap"?400:575) ? "happy" : cert.median < (test==="tap"?1000:1300) ? "idle" : "dizzy") :
    tier ? (result < (test==="tap"?300:450) ? "happy" : result < (test==="tap"?650:900) ? "idle" : result < (test==="tap"?1000:1300) ? "sleepy" : "dizzy") :
    "idle";
  const faceColor =
    phase === "armed" || phase === "early" || phase === "wrong" ? "#FF5D5D" :
    phase === "go" ? "#30E67A" :
    phase === "certificate" && cert ? cert.tier.color :
    tier ? tier.color : "#8EA3FF";

  const shell = {
    minHeight:"100vh", background:"#0D1024", color:"#EDEFFB",
    fontFamily:"'Bricolage Grotesque','Segoe UI',system-ui,sans-serif",
    display:"flex", flexDirection:"column", alignItems:"center", padding:"20px 16px 32px",
  };
  const css = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap');
      @keyframes pulseGo { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
      @keyframes blinkArm { 0%,100%{opacity:1} 50%{opacity:.55} }
      @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
      @keyframes certGlow { 0%,100%{box-shadow:0 0 24px -6px var(--glow)} 50%{box-shadow:0 0 44px -4px var(--glow)} }
      @keyframes riseIn { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .pad:active { transform: scale(.99); }
      .btn { cursor:pointer; border:none; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; border-radius:12px; padding:10px 16px; font-size:14px; transition: transform .08s, opacity .15s; }
      .btn:active { transform: scale(.96); }
      .btn:disabled { opacity:.4; cursor:not-allowed; }
    `}</style>
  );
  const header = (
    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
      <div style={{ width:34, height:34 }}><RobotFace mood="idle" color="#8EA3FF"/></div>
      <div style={{ fontWeight:800, fontSize:26, letterSpacing:"0.5px" }}>
        REACT<span style={{ color:"#8EA3FF" }}>O</span>
      </div>
      {screen==="app" && teamOf(profile?.team) && (
        <div style={{
          fontFamily:"'Space Mono',monospace", fontSize:11, letterSpacing:1,
          color: teamOf(profile.team).color, border:`1px solid ${teamOf(profile.team).color}55`,
          borderRadius:999, padding:"4px 10px",
        }}>{teamOf(profile.team).emoji} {teamOf(profile.team).name}</div>
      )}
    </div>
  );

  // ================= ONBOARDING (ONAY + PROFİL) =================
  if (screen === "onboard") {
    const card = {
      width:"100%", maxWidth:420, background:"linear-gradient(160deg,#232A52,#181C3A)",
      border:"3px solid #3A437C", borderRadius:28, padding:"28px 22px",
      display:"flex", flexDirection:"column", gap:16, animation:"riseIn .4s ease-out",
    };
    if (obStep === "consent") {
      return (
        <div style={shell}>
          {css}{header}
          <div style={card}>
            <div style={{ fontSize:20, fontWeight:800 }}>Verilerin hakkında</div>
            <div style={{ fontSize:14, opacity:.85, lineHeight:1.55 }}>
              Reacto <b>kimlik bilgisi toplamaz</b>. İsim, e-posta, hesap veya çerez yok.
            </div>
            <div style={{ background:"#151935", border:"1px solid #252B52", borderRadius:14, padding:"14px", fontSize:13, opacity:.85, lineHeight:1.55 }}>
              Onay verirsen, <b>resmi test</b> bittiğinde yalnızca şunlar anonim istatistik
              olarak gönderilir: yaş aralığın, takımın, test tipi ve tepki sürelerin.
              IP adresi ve tanımlayıcı hiçbir bilgi kaydedilmez. 18 yaş altı
              seçilirse hiçbir gönderim yapılmaz.
            </div>
            <div style={{ fontSize:12, opacity:.55, lineHeight:1.5 }}>
              Tercihlerin yalnızca bu cihazda saklanır; istediğin an alttaki
              "Onayı sıfırla" bağlantısıyla değiştirebilirsin. Onay vermesen de
              oyunu aynen oynayabilirsin.
            </div>
            <button className="btn" onClick={()=>{ setProfile(p=>({ ...p, consent:"accepted" })); setObStep("profile"); }}
              style={{ background:"#4DFFB0", color:"#12142B", fontSize:15 }}>
              ✓ Kabul ediyorum
            </button>
            <button className="btn" onClick={()=>{ setProfile(p=>({ ...p, consent:"declined" })); setObStep("profile"); }}
              style={{ background:"transparent", color:"#8EA3FF", border:"1px dashed #3A437C", fontSize:13 }}>
              İstemiyorum, sadece oyna
            </button>
          </div>
        </div>
      );
    }
    // obStep === "profile"
    const ready = selAge && selTeam;
    return (
      <div style={shell}>
        {css}{header}
        <div style={card}>
          <div style={{ fontSize:20, fontWeight:800 }}>Kalibrasyon</div>

          <div>
            <div style={{ fontSize:12, letterSpacing:2, opacity:.55, fontFamily:"'Space Mono',monospace", marginBottom:8 }}>YAŞ ARALIĞIN</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
              {AGE_RANGES.map(a=>(
                <button key={a.id} className="btn" onClick={()=>setSelAge(a.id)} style={{
                  background: selAge===a.id ? "#2A3160" : "#151935",
                  color: selAge===a.id ? "#EDEFFB" : "#7C86A8",
                  border:`1px solid ${selAge===a.id ? "#8EA3FF" : "#252B52"}`,
                  fontSize:13, padding:"9px 6px",
                }}>{a.label}</button>
              ))}
            </div>
            {selAge==="u18" && (
              <div style={{ marginTop:8, fontSize:12, color:"#FFE14D", opacity:.85, lineHeight:1.4 }}>
                18 yaş altındasın: oyunun tamamı açık, ancak hiçbir istatistik gönderilmez.
              </div>
            )}
          </div>

          <div>
            <div style={{ fontSize:12, letterSpacing:2, opacity:.55, fontFamily:"'Space Mono',monospace", marginBottom:8 }}>TAKIMINI SEÇ</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              {TEAMS.map(t=>(
                <button key={t.id} className="btn" onClick={()=>setSelTeam(t.id)} style={{
                  background: selTeam===t.id ? `${t.color}22` : "#151935",
                  border:`2px solid ${selTeam===t.id ? t.color : "#252B52"}`,
                  borderRadius:14, padding:"12px 8px",
                  display:"flex", flexDirection:"column", alignItems:"center", gap:3,
                }}>
                  <span style={{ fontSize:26, lineHeight:1 }}>{t.emoji}</span>
                  <span style={{ fontWeight:800, letterSpacing:1.5, fontSize:14, color:t.color }}>{t.name}</span>
                  <span style={{ fontSize:11, color:"#7C86A8" }}>{t.desc}</span>
                </button>
              ))}
            </div>
            <div style={{ marginTop:8, fontSize:11, opacity:.45, lineHeight:1.4 }}>
              Takım seçimi eğlence ve grup istatistiği içindir; kimliğini göstermez.
            </div>
          </div>

          <button className="btn" disabled={!ready} onClick={()=>{
            const p = { consent: profile?.consent || "declined", ageRange: selAge, team: selTeam };
            setProfile(p); saveProfile(p); setScreen("gate");
          }} style={{ background: ready ? "#4DFFB0" : "#151935", color: ready ? "#12142B" : "#5A6172", fontSize:15 }}>
            {ready ? "▶ Devam" : "Yaş aralığı ve takım seç"}
          </button>
        </div>
      </div>
    );
  }

  // ================= İZİN EKRANI =================
  if (screen === "gate") {
    const sensorOk = sensorState === "granted";
    return (
      <div style={shell}>
        {css}{header}
        <div style={{
          width:"100%", maxWidth:420, background:"linear-gradient(160deg,#232A52,#181C3A)",
          border:"3px solid #3A437C", borderRadius:28, padding:"28px 22px",
          display:"flex", flexDirection:"column", gap:16, animation:"riseIn .4s ease-out",
        }}>
          <div style={{ fontSize:20, fontWeight:800 }}>Başlamadan önce</div>
          <div style={{ fontSize:14, opacity:.8, lineHeight:1.5 }}>
            Reacto iki test içerir: <b>👆 Dokunma Refleksi</b> (ekrana dokunma hızı) ve
            <b> 🧭 Yön Refleksi</b> (telefonu okun yönüne eğme). Yön testi telefonunun
            <b> hareket sensörünü</b> kullanır.
          </div>

          <label style={{
            display:"flex", gap:12, alignItems:"flex-start", cursor:"pointer",
            background:"#151935", border:`1px solid ${checked ? "#4DFFB0" : "#252B52"}`,
            borderRadius:14, padding:"14px", transition:"border-color .2s",
          }}>
            <input type="checkbox" checked={checked} onChange={e=>setChecked(e.target.checked)}
              style={{ width:20, height:20, accentColor:"#4DFFB0", marginTop:1, flexShrink:0 }}/>
            <span style={{ fontSize:13, opacity:.85, lineHeight:1.45 }}>
              Hareket sensörü verilerimin yalnızca test sırasında, yalnızca cihazımda kullanılacağını
              anladım ve izin veriyorum. Veriler kaydedilmez ve hiçbir yere gönderilmez.
            </span>
          </label>

          <button className="btn" disabled={!checked || sensorState==="requesting"} onClick={enableSensor}
            style={{ background: sensorOk ? "#0E5A38" : "#4DFFB0", color: sensorOk ? "#B8FFD9" : "#12142B", fontSize:15 }}>
            {sensorState==="idle" && "🧭 Sensörü Etkinleştir"}
            {sensorState==="requesting" && "İzin bekleniyor..."}
            {sensorState==="granted" && "✓ Sensör aktif"}
            {sensorState==="denied" && "İzin reddedildi — tekrar dene"}
            {sensorState==="nodata" && "Sensör verisi yok — tekrar dene"}
          </button>

          {sensorOk && (
            <div style={{ fontFamily:"'Space Mono',monospace", fontSize:12, color:"#4DFFB0", textAlign:"center" }}>
              Canlı eğim: β {tiltNow.beta.toFixed(0)}° / γ {tiltNow.gamma.toFixed(0)}° — telefonu oynat, sayılar değişmeli
            </div>
          )}

          <button className="btn" disabled={!checked || !sensorOk} onClick={()=>{ setSimMode(false); setScreen("app"); }}
            style={{ background: sensorOk && checked ? "#2A3160" : "#151935", color:"#EDEFFB", border:"1px solid #4A56A0", fontSize:15 }}>
            ▶ Teste Geç
          </button>

          {(sensorState==="denied" || sensorState==="nodata") && (
            <button className="btn" disabled={!checked} onClick={()=>{ setSimMode(true); setScreen("app"); }}
              style={{ background:"transparent", color:"#8EA3FF", border:"1px dashed #3A437C", fontSize:13 }}>
              Sensör yoksa devam et (yön testi parmakla sürükleme simülasyonuyla çalışır)
            </button>
          )}

          <div style={{ fontSize:11, opacity:.45, lineHeight:1.4 }}>
            iPhone'da izin penceresi açılır; sensör HTTPS gerektirir. Bu önizleme ortamında sensör
            kısıtlıysa simülasyonla ilerleyebilirsin — gerçek ölçüm için sayfayı telefonda aç.
          </div>
        </div>
      </div>
    );
  }

  // ================= TEST EKRANI =================
  return (
    <div style={shell}
      onPointerDown={simMode && test==="tilt" ? onSimStart : undefined}
      onPointerMove={simMode && test==="tilt" ? onSimMove : undefined}
      onPointerUp={simMode && test==="tilt" ? onSimEnd : undefined}
    >
      {css}{header}

      {/* Test seçici */}
      <div style={{ display:"flex", gap:8, marginBottom:10 }}>
        {["tap","tilt"].map(t => (
          <button key={t} className="btn" onClick={()=>switchTest(t)} style={{
            background: test===t ? "#2A3160" : "#151935",
            color: test===t ? "#EDEFFB" : "#7C86A8",
            border:`1px solid ${test===t ? "#8EA3FF" : "#252B52"}`,
          }}>{TEST_ICONS[t]} {TEST_NAMES[t]}</button>
        ))}
      </div>

      {/* Mod seçici */}
      <div style={{ display:"flex", gap:8, marginBottom:12, alignItems:"center" }}>
        <button className="btn" onClick={exitOfficial} style={{
          background: mode==="free" ? "#2A3160" : "#151935",
          color: mode==="free" ? "#EDEFFB" : "#7C86A8",
          border:`1px solid ${mode==="free" ? "#4A56A0" : "#252B52"}`,
        }}>Serbest</button>
        <button className="btn" onClick={startOfficial} style={{
          background: mode==="official" ? "#4A3A10" : "#151935",
          color: mode==="official" ? "#FFE14D" : "#7C86A8",
          border:`1px solid ${mode==="official" ? "#FFE14D" : "#252B52"}`,
        }}>🏅 Resmi Test</button>
        {simMode && test==="tilt" && <span style={{ fontFamily:"'Space Mono',monospace", fontSize:11, color:"#8EA3FF" }}>SİM</span>}
      </div>

      {mode === "official" && phase !== "certificate" && (
        <div style={{ display:"flex", gap:6, alignItems:"center", marginBottom:12, fontFamily:"'Space Mono',monospace", fontSize:12 }}>
          <span style={{ color:"#FFE14D" }}>Deneme {Math.min(S.official.length+1, OFFICIAL_N)}/{OFFICIAL_N}</span>
          {Array.from({length:OFFICIAL_N}).map((_,i)=>(
            <div key={i} style={{ width:26, height:8, borderRadius:4,
              background: i < S.official.length ? tierFor(test, S.official[i]).color : "#252B52", transition:"background .3s" }}/>
          ))}
          {test==="tilt" && S.wrong > 0 && <span style={{ color:"#FF9B9B" }}>✗{S.wrong}</span>}
        </div>
      )}

      {mode === "free" && (
        <div style={{ display:"flex", gap:8, marginBottom:12, fontFamily:"'Space Mono',monospace", fontSize:12, flexWrap:"wrap", justifyContent:"center" }}>
          <div style={{ background:"#1A1E3E", border:"1px solid #2C3462", borderRadius:10, padding:"6px 12px" }}>
            En iyi: <b style={{ color:"#FFE14D" }}>{S.best !== null ? S.best+" ms" : "—"}</b>
          </div>
          <div style={{ background:"#1A1E3E", border:"1px solid #2C3462", borderRadius:10, padding:"6px 12px" }}>
            Ortalama: <b style={{ color:"#8EA3FF" }}>{avg !== null ? avg+" ms" : "—"}</b>
          </div>
          <div style={{ background:"#1A1E3E", border:"1px solid #2C3462", borderRadius:10, padding:"6px 12px" }}>
            Deneme: <b>{S.history.length}</b>
          </div>
          {test==="tilt" && (
            <div style={{ background:"#1A1E3E", border:"1px solid #2C3462", borderRadius:10, padding:"6px 12px" }}>
              Yanlış: <b style={{ color:"#FF9B9B" }}>{S.wrong}</b>
            </div>
          )}
        </div>
      )}

      {phase === "certificate" && cert ? (
        <div style={{
          width:"100%", maxWidth:420, borderRadius:28, padding:"30px 22px",
          background:"linear-gradient(160deg,#232A52,#181C3A)",
          border:`3px solid ${cert.tier.color}`,
          display:"flex", flexDirection:"column", alignItems:"center", gap:10, textAlign:"center",
          "--glow": cert.tier.color + "66",
          animation:"riseIn .4s ease-out, certGlow 2.4s infinite",
        }}>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:11, letterSpacing:3, color:"#8EA3FF" }}>
            {TEST_ICONS[test]} {TEST_NAMES[test].toUpperCase()} — RESMİ SONUÇ
          </div>
          <div style={{ width:96, height:96, animation:"popIn .4s .1s ease-out both" }}>
            <RobotFace mood={mood} color={cert.tier.color}/>
          </div>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:56, fontWeight:700, lineHeight:1, color:cert.tier.color, animation:"popIn .35s .2s ease-out both" }}>
            {cert.median}<span style={{ fontSize:20, opacity:.7 }}> ms</span>
          </div>
          <div style={{ fontSize:11, fontFamily:"'Space Mono',monospace", opacity:.55, marginTop:-4 }}>
            {OFFICIAL_N} denemenin medyanı
          </div>
          <div style={{
            fontSize:22, fontWeight:800, letterSpacing:2, color:cert.tier.color,
            border:`2px solid ${cert.tier.color}`, borderRadius:999, padding:"8px 22px",
            animation:"popIn .35s .35s ease-out both",
          }}>
            {cert.tier.emoji} {cert.tier.name}
          </div>
          <div style={{ opacity:.85, fontSize:14, maxWidth:290 }}>{cert.tier.msg}</div>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:13, color:"#8EA3FF" }}>
            İnsanların %{cert.pct < 1 ? cert.pct.toFixed(1) : Math.round(cert.pct)}'inden hızlısın
          </div>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", justifyContent:"center", marginTop:4 }}>
            {cert.attempts.map((ms,i)=>(
              <div key={i} style={{
                fontFamily:"'Space Mono',monospace", fontSize:12,
                background:"#151935", border:`1px solid ${tierFor(test, ms).color}55`,
                color: ms === cert.median ? cert.tier.color : "#9AA3C8",
                fontWeight: ms === cert.median ? 700 : 400,
                borderRadius:8, padding:"4px 9px",
              }}>{ms}{ms === cert.median ? " ◂" : ""}</div>
            ))}
          </div>
          {test==="tilt" && S.wrong > 0 && (
            <div style={{ fontSize:12, fontFamily:"'Space Mono',monospace", color:"#FF9B9B" }}>Yanlış yön: {S.wrong} kez</div>
          )}
          <div style={{ display:"flex", gap:10, marginTop:12 }}>
            <button className="btn" onClick={shareCert} style={{ background:cert.tier.color, color:"#12142B" }}>📤 Sonucu Paylaş</button>
            <button className="btn" onClick={startOfficial} style={{ background:"#2A3160", color:"#EDEFFB", border:"1px solid #4A56A0" }}>↻ Yeni Test</button>
          </div>
          {shareMsg && <div style={{ fontSize:12, fontFamily:"'Space Mono',monospace", color:"#4DFFB0" }}>{shareMsg}</div>}
          <button className="btn" onClick={exitOfficial} style={{ background:"transparent", color:"#7C86A8", fontSize:12, padding:"4px 8px" }}>
            Serbest moda dön
          </button>
        </div>
      ) : (
      <div
        className="pad"
        onPointerDown={handlePad}
        role="button" tabIndex={0}
        onKeyDown={(e)=>{ if((e.key===" "||e.key==="Enter") && test==="tap"){ e.preventDefault(); handlePad(); }}}
        style={{
          width:"100%", maxWidth:420, minHeight:400,
          background: {
            idle:"linear-gradient(160deg,#232A52,#181C3A)",
            armed:"linear-gradient(160deg,#5A1B26,#3A1119)",
            go:"linear-gradient(160deg,#0E5A38,#0A3D27)",
            result:"linear-gradient(160deg,#232A52,#181C3A)",
            early:"linear-gradient(160deg,#5A1B26,#3A1119)",
            wrong:"linear-gradient(160deg,#5A1B26,#3A1119)",
          }[phase],
          border:`3px solid ${
            phase==="armed"||phase==="early"||phase==="wrong" ? "#FF5D5D" :
            phase==="go" ? "#30E67A" :
            phase==="result" && tier ? tier.color :
            mode==="official" ? "#FFE14D" : "#3A437C"}`,
          borderRadius:28, cursor:"pointer", userSelect:"none", touchAction:"none",
          display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
          gap:10, padding:"28px 20px", textAlign:"center",
          transition:"background .2s, border-color .2s",
          animation: phase==="go" ? "pulseGo .5s infinite" : "none",
          outline:"none",
        }}
      >
        {!(phase==="go" && test==="tilt") && (
          <div style={{ width:100, height:100, animation: phase==="armed" ? "blinkArm 1s infinite" : phase==="result" ? "popIn .3s ease-out" : "none" }}>
            <RobotFace mood={mood} color={faceColor}/>
          </div>
        )}

        {phase === "idle" && (
          <>
            <div style={{ fontSize:22, fontWeight:800 }}>
              {mode==="official" ? "Resmi test başlıyor." : test==="tap" ? "Dokunma refleksi." : "Yön refleksi."}
            </div>
            <div style={{ opacity:.75, fontSize:14, maxWidth:300 }}>
              {test==="tap"
                ? <>Dokun ve bekle. Ekran <b style={{color:"#30E67A"}}>yeşile</b> döndüğü an tekrar dokun.</>
                : <>Dokun, telefonu düz tut ve bekle. Ok belirdiği an telefonu <b>okun yönüne eğ</b>.{simMode && " (Sim: parmağını o yöne sürükle.)"}</>}
              {mode==="official" && <> {OFFICIAL_N} deneme; unvanı <b>medyan</b> belirler.</>}
            </div>
            <div style={{ marginTop:8, fontFamily:"'Space Mono',monospace", fontSize:13, color: mode==="official" ? "#FFE14D" : "#8EA3FF" }}>▶ BAŞLAT</div>
          </>
        )}

        {phase === "armed" && (
          <>
            <div style={{ fontSize:22, fontWeight:800, color:"#FF9B9B" }}>
              {test==="tap" ? "Bekle..." : "Düz tut, bekle..."}
            </div>
            <div style={{ opacity:.7, fontSize:13 }}>
              {test==="tap" ? "Yeşili görmeden dokunma" : "Ok her an gelebilir"}
            </div>
          </>
        )}

        {phase === "go" && test==="tap" && (
          <div style={{ fontSize:34, fontWeight:800, color:"#B8FFD9", letterSpacing:1 }}>DOKUN!</div>
        )}

        {phase === "go" && test==="tilt" && target && (
          <>
            <div style={{ fontSize:110, lineHeight:1, color:"#B8FFD9", animation:"popIn .12s ease-out" }}>{DIRS[target].arrow}</div>
            <div style={{ fontSize:26, fontWeight:800, letterSpacing:3, color:"#B8FFD9" }}>{DIRS[target].label} EĞ!</div>
          </>
        )}

        {phase === "early" && (
          <>
            <div style={{ fontSize:20, fontWeight:800, color:"#FF9B9B" }}>Erken dokundun!</div>
            <div style={{ opacity:.75, fontSize:13, maxWidth:260 }}>
              {mode==="official" ? "Bu deneme sayılmadı — tekrarlanacak." : "100 ms altı tepki insan için imkânsızdır — sen tahmin ettin."}
            </div>
            <div style={{ marginTop:8, fontFamily:"'Space Mono',monospace", fontSize:13, color:"#8EA3FF" }}>↻ TEKRAR DENE</div>
          </>
        )}

        {phase === "wrong" && (
          <>
            <div style={{ fontSize:20, fontWeight:800, color:"#FF9B9B" }}>Yanlış yön!</div>
            <div style={{ opacity:.75, fontSize:13, maxWidth:280 }}>
              Hız vardı ama karar yanlıştı — seçimli tepkinin zor kısmı bu.
              {mode==="official" && " Bu deneme sayılmadı, tekrarlanacak."}
            </div>
            <div style={{ marginTop:8, fontFamily:"'Space Mono',monospace", fontSize:13, color:"#8EA3FF" }}>↻ TEKRAR DENE</div>
          </>
        )}

        {phase === "result" && tier && (
          <div style={{ animation:"popIn .3s ease-out", display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
            <div style={{ fontFamily:"'Space Mono',monospace", fontSize:52, fontWeight:700, lineHeight:1, color:tier.color }}>
              {result}<span style={{ fontSize:20, opacity:.7 }}> ms</span>
            </div>
            {mode === "free" ? (
              <>
                <div style={{ fontSize:20, fontWeight:800, letterSpacing:2, color:tier.color, border:`2px solid ${tier.color}`, borderRadius:999, padding:"6px 18px", marginTop:4 }}>
                  {tier.emoji} {tier.name}
                </div>
                <div style={{ opacity:.8, fontSize:14, maxWidth:280 }}>{tier.msg}</div>
                <div style={{ fontFamily:"'Space Mono',monospace", fontSize:12, color:"#8EA3FF", marginTop:2 }}>
                  İnsanların %{pct < 1 ? pct.toFixed(1) : Math.round(pct)}'inden hızlısın
                </div>
              </>
            ) : (
              <div style={{ opacity:.8, fontSize:14 }}>Kaydedildi — {OFFICIAL_N - S.official.length} deneme kaldı</div>
            )}
            <div style={{ marginTop:8, fontFamily:"'Space Mono',monospace", fontSize:13, color:"#8EA3FF" }}>
              {mode==="official" ? "▶ SONRAKİ DENEME" : "↻ TEKRAR"}
            </div>
          </div>
        )}
      </div>
      )}

      {mode === "free" && S.history.length > 0 && phase !== "certificate" && (
        <div style={{ marginTop:14, display:"flex", gap:6, flexWrap:"wrap", justifyContent:"center", maxWidth:420 }}>
          {S.history.map((ms,i)=>{ const t=tierFor(test, ms); return (
            <div key={i} style={{ fontFamily:"'Space Mono',monospace", fontSize:12, background:"#1A1E3E",
              border:`1px solid ${t.color}55`, color:t.color, borderRadius:8, padding:"4px 9px" }}>{ms}</div>
          );})}
        </div>
      )}

      <div style={{ marginTop:22, width:"100%", maxWidth:420 }}>
        <div style={{ fontSize:12, letterSpacing:2, opacity:.55, marginBottom:8, fontFamily:"'Space Mono',monospace" }}>
          SEVİYELER — {TEST_NAMES[test].toUpperCase()}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
          {TIERS.map((t,i)=>{
            const lo = i===0 ? 0 : TIERS[i-1].max;
            const label = t.max===Infinity ? `${lo}+ ms` : `${lo}–${t.max} ms`;
            const active = (phase==="certificate" && cert && cert.tier.name===t.name) || (phase==="result" && tier && tier.name===t.name);
            return (
              <div key={t.name} style={{
                display:"flex", justifyContent:"space-between", alignItems:"center",
                background: active ? `${t.color}22` : "#151935",
                border:`1px solid ${active ? t.color : "#252B52"}`,
                borderRadius:10, padding:"7px 11px", fontSize:12, transition:"background .3s, border-color .3s",
              }}>
                <span style={{ fontWeight:700, color:t.color }}>{t.emoji} {t.name}</span>
                <span style={{ fontFamily:"'Space Mono',monospace", opacity:.65 }}>{label}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ marginTop:18, textAlign:"center", fontSize:11, opacity:.5, lineHeight:1.6, maxWidth:420 }}>
        {profile?.consent === "accepted" && profile?.ageRange !== "u18"
          ? "Resmi test sonuçların anonim istatistik olarak gönderilir (kimlik bilgisi içermez)."
          : "Hiçbir veri gönderilmiyor — sadece oynuyorsun."}
        {" "}
        <span onClick={()=>{ clearProfile(); setProfile(null); setSelAge(null); setSelTeam(null); setObStep("consent"); setScreen("onboard"); }}
          style={{ color:"#8EA3FF", cursor:"pointer", textDecoration:"underline" }}>
          Onayı sıfırla
        </span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Reacto />);
</script>
</body>
</html>
